<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cats vs Dogs — Defend the Kingdom (PlayCanvas)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
  #app-canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<canvas id="app-canvas"></canvas>

<!-- Open-source PlayCanvas engine, self-hosted from their CDN — no cloud
     editor / account needed, this is just a JS library like Three.js was. -->
<script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>

<!-- Same load-order idea as the old js/ folder: pure data first, then the
     code that turns it into a scene. -->
<script src="js/mapData.js"></script>
<script src="js/main.js"></script>
</body>
</html>
