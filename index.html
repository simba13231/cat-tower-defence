<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cats vs Dogs — Tower Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#263238;--green:#4caf50;--shadow:0 8px 0 rgba(34,55,38,.18),0 14px 30px rgba(34,55,38,.16)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#8ed0f0}
button{font:inherit}#app{position:fixed;inset:0;overflow:hidden}#app-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:14px;left:14px;right:14px;height:64px;display:none;align-items:center;gap:10px;z-index:5;pointer-events:none}
.hud-pill{height:48px;min-width:92px;padding:5px 14px 5px 8px;background:rgba(255,255,255,.96);border:3px solid rgba(40,60,42,.14);border-radius:18px;box-shadow:0 5px 0 rgba(35,60,40,.14);display:flex;align-items:center;gap:9px}
.hud-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#ffe19a;box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}.hud-pill.lives .hud-icon{background:#ffd1d1}
.hud-label{font-size:10px;font-weight:900;text-transform:uppercase;opacity:.55;line-height:1}.hud-value{font-size:18px;font-weight:900;line-height:1.05}
.wave-pill{padding:8px 16px;background:#3f78d8;color:#fff;border-color:rgba(0,0,0,.08);min-width:100px}.wave-pill .hud-label{color:#dce9ff;opacity:1}.wave-pill .hud-value{font-size:17px}
.spacer{flex:1}.game-btn{pointer-events:auto;border:0;cursor:pointer;border-radius:15px;padding:13px 18px;font-weight:900;color:#fff;background:linear-gradient(#68d86c,#3aa64b);box-shadow:0 5px 0 #2b8139,0 8px 18px rgba(0,0,0,.16);transition:transform .08s,filter .08s}
.game-btn:hover{filter:brightness(1.06)}.game-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2b8139}.game-btn:disabled{filter:grayscale(.8);opacity:.65;cursor:default}
#towerBar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;z-index:6;background:rgba(255,255,255,.97);border:3px solid rgba(40,60,42,.13);border-radius:23px;padding:9px;box-shadow:var(--shadow);gap:8px;max-width:calc(100vw - 28px)}
.tower-card{position:relative;width:112px;height:82px;border:0;border-radius:17px;background:#f6f8f2;cursor:pointer;padding:7px;display:grid;grid-template-columns:43px 1fr;grid-template-rows:1fr 21px;text-align:left;transition:transform .1s,background .1s,box-shadow .1s}
.tower-card:hover{transform:translateY(-3px);background:#edf7e8}.tower-card.selected{background:#dff5d9;box-shadow:inset 0 0 0 3px #55bd5b}.tower-card:disabled{opacity:.4;filter:grayscale(.5);cursor:default;transform:none}
.tower-face{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;font-size:23px;grid-row:1/3;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}.tower-name{font-size:12px;font-weight:900;align-self:end;white-space:nowrap}.tower-desc{font-size:9px;font-weight:800;opacity:.52;white-space:nowrap}.cost{position:absolute;right:7px;bottom:6px;background:#ffc857;color:#714e00;border-radius:8px;padding:2px 6px;font-size:10px;font-weight:900}
#selection{position:absolute;display:none;z-index:7;width:250px;background:rgba(255,255,255,.98);border:3px solid rgba(40,60,42,.14);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
#selection h3{margin:0 0 2px;font-family:Fredoka;font-size:21px}.sub{font-size:11px;font-weight:800;opacity:.55;margin-bottom:10px}.statrow{display:flex;gap:7px;margin-bottom:11px}.stat{flex:1;background:#f2f5ee;border-radius:11px;padding:7px;text-align:center}.stat b{display:block;font-size:14px}.stat span{font-size:9px;font-weight:900;opacity:.55;text-transform:uppercase}
.action-row{display:flex;gap:7px}.small-btn{flex:1;border:0;border-radius:11px;padding:9px 7px;cursor:pointer;font-weight:900;background:#e9f5e6;color:#26753a}.small-btn.sell{background:#ffe4e4;color:#a82e2e}.small-btn:disabled{opacity:.45;cursor:default}
#message{position:absolute;left:50%;top:92px;transform:translateX(-50%) translateY(-8px);z-index:10;opacity:0;pointer-events:none;background:#263238;color:#fff;border-radius:13px;padding:9px 16px;font-size:13px;font-weight:900;box-shadow:0 5px 16px rgba(0,0,0,.2);transition:opacity .18s,transform .18s}#message.show{opacity:1;transform:translateX(-50%) translateY(0)}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);z-index:9;opacity:0;pointer-events:none;text-align:center;font-family:Fredoka;font-weight:700;font-size:clamp(34px,6vw,66px);color:#fff;text-shadow:0 5px 0 rgba(44,78,44,.3),0 12px 25px rgba(0,0,0,.18);transition:opacity .2s,transform .25s}.banner-sub{display:block;font-family:Nunito;font-size:15px;text-shadow:none;margin-top:2px}
#titleScreen,#defeatOverlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(44,120,166,.08),rgba(48,117,61,.15));padding:20px}
#titleScreen .card,#defeatOverlay .card{width:min(520px,94vw);text-align:center;background:rgba(255,255,255,.97);border:4px solid rgba(38,61,41,.12);border-radius:30px;padding:34px 30px 30px;box-shadow:0 14px 0 rgba(35,66,40,.14),0 25px 55px rgba(0,0,0,.18)}
.logo{font-family:Fredoka;font-size:clamp(38px,8vw,64px);font-weight:700;letter-spacing:-1.5px;margin:0;color:#315b37;text-shadow:0 4px 0 #d8edc8}.logo span{color:#e34f4f}.subtitle{margin:5px auto 23px;font-size:15px;font-weight:800;opacity:.62;max-width:390px}
.play{font-size:20px;padding:15px 42px;border-radius:17px}.hint{margin:15px 0 0;font-size:11px;font-weight:800;opacity:.45}.defeat-title{font-family:Fredoka;font-size:42px;margin:0 0 5px;color:#d84b4b}.result{font-size:15px;font-weight:800;opacity:.65;margin-bottom:20px}
@media(max-width:760px){#hud{top:8px;left:8px;right:8px;height:52px}.hud-pill{height:43px;min-width:70px;padding:4px 9px}.hud-icon{width:29px;height:29px;font-size:16px}.hud-value{font-size:15px}.hud-label{font-size:8px}.wave-pill{min-width:80px}.game-btn{padding:10px 12px;font-size:12px}.tower-card{width:78px;height:72px;grid-template-columns:34px 1fr;padding:6px}.tower-face{width:31px;height:31px;font-size:18px}.tower-name{font-size:10px}.tower-desc{display:none}.cost{font-size:9px}#towerBar{gap:4px;padding:6px;border-radius:18px}}
</style>
</head>
<body>
<div id="app">
<canvas id="app-canvas"></canvas>
<div id="hud">
  <div class="hud-pill"><div class="hud-icon">🪙</div><div><div class="hud-label">Cash</div><div class="hud-value" id="hudCoins">220</div></div></div>
  <div class="hud-pill lives"><div class="hud-icon">❤️</div><div><div class="hud-label">Lives</div><div class="hud-value" id="hudLives">20</div></div></div>
  <div class="hud-pill wave-pill"><div><div class="hud-label">Round</div><div class="hud-value" id="hudWave">0</div></div></div>
  <div class="spacer"></div><button id="startWaveBtn" class="game-btn">Start Round 1</button>
</div>
<div id="message"></div><div id="banner"></div>
<div id="selection">
  <h3 id="selName">Cat</h3><div class="sub" id="selType">Tower</div>
  <div class="statrow"><div class="stat"><b id="selDamage">0</b><span>Damage</span></div><div class="stat"><b id="selRange">0</b><span>Range</span></div><div class="stat"><b id="selRate">0</b><span>Speed</span></div></div>
  <div class="action-row"><button class="small-btn" id="upgradeBtn">Upgrade</button><button class="small-btn sell" id="sellBtn">Sell</button></div>
</div>
<div id="towerBar">
  <button class="tower-card" data-type="scout"><span class="tower-face" style="background:#ffd58a">🐱</span><span class="tower-name">Scout</span><span class="tower-desc">Fast shots</span><span class="cost">$50</span></button>
  <button class="tower-card" data-type="angry"><span class="tower-face" style="background:#ff9b9b">😾</span><span class="tower-name">Angry</span><span class="tower-desc">Heavy hit</span><span class="cost">$70</span></button>
  <button class="tower-card" data-type="wizard"><span class="tower-face" style="background:#caa8ef">🧙</span><span class="tower-name">Wizard</span><span class="tower-desc">Splash</span><span class="cost">$100</span></button>
  <button class="tower-card" data-type="robot"><span class="tower-face" style="background:#91e1d7">🤖</span><span class="tower-name">Robot</span><span class="tower-desc">Rapid fire</span><span class="cost">$120</span></button>
</div>
<div id="titleScreen"><div class="card"><h1 class="logo">Cats <span>vs</span> Dogs</h1><p class="subtitle">Build your cat squad, pop the dogs, and protect the village.</p><button id="playBtn" class="game-btn play">Play</button><div class="hint">Bright, original cartoon tower-defense presentation.</div></div></div>
<div id="defeatOverlay" style="display:none"><div class="card"><h2 class="defeat-title">The dogs broke through!</h2><div class="result" id="resultText">You reached Round 0.</div><button id="retryBtn" class="game-btn play">Try Again</button></div></div>
</div>
<script src="js/mapData.js"></script>
<script src="js/audioPC.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/gamePC.js"></script>
<script src="js/inputPC.js"></script>
</body>
</html>
